name: Mantenir Addon Actiu

# Fa ping als endpoints del catàleg cada 10 minuts per mantenir:
# 1. La funció serverless de Vercel "calenta" (evita cold starts)
# 2. La CDN cache renovada (respostes instantànies)
#
# Sense això, després de ~24h sense tràfic, Stremio pot fer timeout
# esperant que la funció arrenqui → "Failed to fetch"

on:
  schedule:
    # Cada 10 minuts
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-warm:
    runs-on: ubuntu-latest
    steps:
      - name: Ping endpoints del catàleg
        run: |
          echo "Fent ping als endpoints..."
          
          # Manifest
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://stremio-en-catala.vercel.app/manifest.json")
          echo "manifest.json: $STATUS"
          
          # Catàleg pel·lícules
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://stremio-en-catala.vercel.app/catalog/movie/catalan_movies.json")
          echo "catalan_movies: $STATUS"
          
          # Catàleg sèries
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://stremio-en-catala.vercel.app/catalog/series/catalan_series.json")
          echo "catalan_series: $STATUS"
          
          echo "Ping completat!"
