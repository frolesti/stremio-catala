name: Validar configuracio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Els tests de configuracio nomes utilitzen moduls natius de Node.js.
      - name: Comprovar compatibilitat amb Vercel Hobby
        run: npm test
